<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Avisos WhatsApp</title>
<style>
  body{width:310px;margin:0;padding:14px;font:14px Arial;color:#163b36;background:#f7fffd}h3{margin:0 0 5px;color:#128c7e}p{font-size:12px;color:#60736f;margin:0 0 14px}label{display:block;margin:12px 0;cursor:pointer}input{margin-right:7px}#dashboardUrl{display:block;width:100%;box-sizing:border-box;margin:5px 0;padding:7px;border:1px solid #c7ded9;border-radius:6px}button{padding:8px 10px;border:0;border-radius:7px;background:#128c7e;color:#fff;font-weight:700;cursor:pointer}#status{font-size:12px;color:#128c7e;min-height:30px;margin-top:9px;line-height:1.4}
</style>
<h3>WhatsApp — Recebimento</h3>
<p>Detecta confirmações novas e envia-as à tabela Análise Recebimento.</p>
<label>Link do dashboard<input id="dashboardUrl" type="url" placeholder="https://seu-dashboard/" autocomplete="url"></label>
<button id="saveDashboard" type="button">Salvar link e ativar sincronização</button>
<label><input id="floatingButton" type="checkbox"> Botão flutuante RECEBIMENTO</label>
<label><input id="enabled" type="checkbox"> Ativar captação/avisos</label>
<label><input id="browserNotification" type="checkbox"> Notificação do navegador</label>
<label><input id="sound" type="checkbox"> Som do aviso</label>
<small>O acesso é solicitado somente para o domínio inserido acima.</small>
<div id="status" role="status" aria-live="polite"></div>
<script src="popup.js"></script>
